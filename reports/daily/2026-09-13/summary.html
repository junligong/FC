<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日综合报告 - 2026-09-13</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --green: #3fb950;
    --amber: #d29922;
    --blue: #58a6ff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.5px;
    color: var(--text);
  }
  .header-left .date {
    font-size: 13px;
    color: var(--text3);
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .header-stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text2);
  }
  .header-stat .num {
    font-size: 18px;
    font-weight: 700;
  }
  .header-stat .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ===== Tabs ===== */
  .tabs-container {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 65px;
    z-index: 99;
  }
  .tabs {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text2);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,.03);
  }
  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--blue);
  }
  .tab-icon { font-size: 18px; }
  .tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tab-dot-ok { background: var(--green); }
  .tab-dot-paused { background: var(--amber); }

  /* ===== Tab Panels ===== */
  .panels-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0;
  }
  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Panel Header ===== */
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .panel-title-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-icon {
    font-size: 24px;
  }
  .panel-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .panel-desc {
    font-size: 13px;
    color: var(--text3);
  }
  .panel-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .section-status-ok {
    background: rgba(63,185,80,.12);
    color: var(--green);
  }
  .section-status-paused {
    background: rgba(210,153,34,.12);
    color: var(--amber);
  }
  .section-link {
    font-size: 13px;
    color: var(--blue);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid rgba(88,166,255,.3);
    border-radius: 6px;
    transition: all .2s;
  }
  .section-link:hover {
    background: rgba(88,166,255,.1);
    border-color: var(--blue);
  }

  /* ===== Panel Body (iframe) ===== */
  .panel-body {
    background: var(--bg);
    min-height: 500px;
  }
  .panel-iframe {
    width: 100%;
    height: calc(100vh - 140px);
    min-height: 600px;
    border: none;
    display: block;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text3);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 0;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .header-right { flex-wrap: wrap; }
    .tab-btn { padding: 10px 14px; font-size: 13px; }
    .tab-label { display: none; }
    .panel-header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 16px; }
    .panel-iframe { height: calc(100vh - 160px); }
  }
</style>
</head>

<script>
  // Tab 切换逻辑
  const tabBtns = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-panel');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.source).classList.add('active');
    });
  });

  // 键盘快捷键: 1/2/3 切换
  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '3') {
      const idx = parseInt(e.key) - 1;
      if (tabBtns[idx]) tabBtns[idx].click();
    }
  });

  // URL hash 支持直接访问某个板块
  function activateFromHash() {
    const hash = window.location.hash.slice(1);
    const source = document.querySelector('[data-source="' + hash + '"]');
    if (source) {
      tabBtns.forEach(b => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      source.classList.add('active');
      document.getElementById('panel-' + hash).classList.add('active');
    }
  }
  if (window.location.hash) activateFromHash();
  window.addEventListener('hashchange', activateFromHash);
</script>
